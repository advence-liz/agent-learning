<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 432" role="img" aria-labelledby="title desc">
  <title id="title">执行边界：建议不等于授权</title>
  <desc id="desc">以退款为例，模型提出订单和金额；网关检查参数和授权，未获准时不派发；只有获准的请求才会到业务服务，由服务再次校验身份及订单范围后执行。</desc>
  <style>
    svg { --bg:#101826; --ink:#f6f1e7; --muted:#b9c5d7; --rule:#334258; --amber:#c78532; --teal:#169f88; --blocked:#8d9bae; }
    text { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill:var(--ink); }
    .kicker { font-size:17px; font-weight:650; letter-spacing:1.4px; }
    .headline { font-size:45px; font-weight:760; }
    .label { font-size:25px; font-weight:720; }
    .small { font-size:17px; fill:var(--muted); }
    .rail { fill:none; stroke-width:7; stroke-linejoin:round; stroke-linecap:round; }
    .station { fill:var(--bg); stroke-width:4; }
  </style>
  <rect width="720" height="432" rx="22" fill="var(--bg)"/>
  <circle cx="52" cy="52" r="5" fill="var(--amber)"/><circle cx="69" cy="52" r="5" fill="var(--teal)"/>
  <text x="89" y="58" class="kicker">AGENT 图谱 / 执行边界</text>
  <text x="46" y="117" class="headline">建议不等于授权</text>
  <text x="46" y="148" class="small">用一笔虚构退款，看清决定在哪一层发生</text>
  <path d="M46 174H674 M46 387H674" stroke="var(--rule)"/>

  <path d="M135 240H360" class="rail" stroke="var(--amber)"/>
  <path d="M360 240H588" class="rail" stroke="var(--teal)"/>
  <path d="M360 252V329Q360 353 384 353H449" class="rail" stroke="var(--blocked)" stroke-width="4" stroke-dasharray="4 10"/>
  <path d="M250 232l12 8-12 8z" fill="var(--amber)"/>
  <path d="M470 232l12 8-12 8z" fill="var(--teal)"/>
  <g text-anchor="middle">
    <text x="135" y="214" class="label">模型</text>
    <text x="360" y="214" class="label">运行时 / 网关</text>
    <text x="588" y="214" class="label">退款服务</text>
    <text x="245" y="273" class="small">请求</text>
    <text x="474" y="273" class="small">获准后派发</text>
  </g>
  <circle cx="135" cy="240" r="10" stroke="var(--amber)" class="station"/>
  <circle cx="360" cy="240" r="13" stroke="var(--ink)" class="station"/>
  <circle cx="588" cy="240" r="10" stroke="var(--teal)" class="station"/>
  <g text-anchor="middle" class="small">
    <text x="135" y="296">提出订单与金额</text>
    <text x="135" y="320">不授予权限</text>
    <text x="588" y="296">复核身份与订单范围</text>
    <text x="588" y="320">通过才执行</text>
  </g>
  <rect x="279" y="280" width="162" height="51" rx="13" fill="#1d2736" stroke="var(--rule)"/>
  <g text-anchor="middle" class="small">
    <text x="360" y="301">检查参数与授权</text>
    <text x="360" y="322">按策略要求审批</text>
  </g>
  <rect x="442" y="344" width="7" height="18" rx="3.5" fill="var(--blocked)"/>
  <text x="463" y="359" class="small">未获准 · 不派发</text>
  <text x="46" y="413" class="small">建议、授权、执行分开；凭证留在模型之外。</text>
</svg>
