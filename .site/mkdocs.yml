# 由 tools/build_site.py 生成，不要手改
site_name: AI 开发学习知识库
site_url: !ENV [KB_SITE_URL, '']   # GitHub Pages 构建时由 CI 设置
docs_dir: docs
site_dir: build
use_directory_urls: false
theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.expand
    - navigation.footer
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link   # 同名标签页全站联动：选一次 Python，所有代码块都切到 Python
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle: {icon: material/brightness-7, name: 切换到暗色}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle: {icon: material/brightness-4, name: 切换到亮色}
plugins:
  - search:
      lang: [zh, en]
  - d2:   # ```d2 代码块在构建时渲染成内联 SVG；亮/暗主题各出一份，跟随站点配色切换
      layout: elk
      theme: 0
      dark_theme: 200
      pad: 20
hooks:
  - hooks.py   # on_config 里按 curriculum.json 动态生成 nav
markdown_extensions:
  - toc: {permalink: true}
  - tables
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - pymdownx.details
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.inlinehilite
  - pymdownx.tasklist: {custom_checkbox: true}
  - pymdownx.arithmatex: {generic: true}
  - pymdownx.superfences   # ```d2 围栏由 d2 插件自己注册
  - pymdownx.tabbed: {alternate_style: true}   # 代码的 Node / Python 两个版本，第一个标签页（Node）默认展开
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
