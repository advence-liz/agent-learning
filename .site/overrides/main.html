{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  {% if page %}
    <link rel="stylesheet" href="{{ 'assets/stylesheets/course-preview.css' | url }}">
  {% endif %}
{% endblock %}

{% block content %}
  {% if course_tracks %}
    {% include "partials/course-home.html" %}
  {% elif page %}
    <div class="course-article{% if page.file.src_uri == 'p3-agent-internals/13-agent-build-guide.md' %} course-build-guide{% endif %}">{{ super() }}</div>
  {% else %}
    {{ super() }}
  {% endif %}
{% endblock %}
