# 跑配套代码的离线测试（全部用 fake 模型，不需要 API key）。
# code/ml 依赖 torch，在 Linux 上会拉 CUDA 版（数 GB），默认不跑；需要时手动触发并勾选 run_ml。
name: Tests

on:
  push:
    branches: [main]
    paths: ['code/**', '.github/workflows/tests.yml']
  pull_request:
    paths: ['code/**', '.github/workflows/tests.yml']
  workflow_dispatch:
    inputs:
      run_ml:
        description: '也跑 code/ml（下载 torch，较慢）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [agent, mini_cc, ml]
    steps:
      - uses: actions/checkout@v4
        if: matrix.project != 'ml' || inputs.run_ml

      - uses: astral-sh/setup-uv@v6
        if: matrix.project != 'ml' || inputs.run_ml
        with:
          enable-cache: true
          cache-dependency-glob: code/${{ matrix.project }}/uv.lock

      - name: pytest
        if: matrix.project != 'ml' || inputs.run_ml
        working-directory: code/${{ matrix.project }}
        run: |
          uv sync --frozen
          uv run --frozen pytest -q

      - name: unittest (http_analyzer)
        if: matrix.project == 'agent'
        working-directory: code/agent
        run: uv run --frozen python -m unittest discover -s http_analyzer/tests
